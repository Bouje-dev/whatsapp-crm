<div class="adstat-team">
  <p class="adstat-kicker"><i class="fas fa-users"></i> Team</p>
  <h3>Team Performance</h3>
  <p class="adstat-team-sub">Orders created in the selected period.</p>
  <div class="adstat-board">
    <table class="adstat-table">
      <thead>
        <tr>
          <th>Agent name</th>
          <th>Total orders</th>
          <th>Confirmed</th>
          <th>Conf. rate</th>
          <th>Delivered</th>
          <th>Del. rate</th>
          <th>Pending</th>
          <th>Cancelled</th>
          <th>Returned</th>
        </tr>
      </thead>
      <tbody id="team_stats_body">
        <tr>
          <td class="adstat-empty" colspan="9">Loading team performance…</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
window.loadTeamStats = async function(channelId) {
  const activeId = channelId || window.currentChannelId;
  const tbody = document.getElementById('team_stats_body');
  if (!tbody || !activeId || activeId === 'null') return;

  tbody.innerHTML = '<tr><td class="adstat-empty" colspan="9">Loading team performance…</td></tr>';

  try {
    const period = window.adstatPeriod || { range: 'today', from: '', to: '' };
    let url = '/discount/whatssapAPI/api/dashboard/team/?channel_id=' + encodeURIComponent(activeId) + '&range=' + encodeURIComponent(period.range || 'today');
    if (period.range === 'custom') {
      url += '&from=' + encodeURIComponent(period.from || '') + '&to=' + encodeURIComponent(period.to || '');
    }
    const res = await fetch(url, { credentials: 'same-origin' });
    const data = await res.json();
    renderTeamTable(data.stats, tbody);
  } catch (e) {
    console.error('Failed to load team stats', e);
    tbody.innerHTML = '<tr><td class="adstat-error" colspan="9">Failed to load team performance.</td></tr>';
  }
};

function renderTeamTable(stats, tbody) {
  if (!stats || stats.length === 0) {
    tbody.innerHTML = '<tr><td class="adstat-empty" colspan="9">No data for this channel.</td></tr>';
    return;
  }

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
    });
  }

  tbody.innerHTML = stats.map(function (agent) {
    var name = agent.name || agent.initial || 'Agent';
    var initial = String(name).trim().charAt(0).toUpperCase() || '?';
    var confClass = agent.conf_rate >= 50 ? 'is-good' : 'is-bad';
    var delClass = agent.del_rate >= 70 ? 'is-deliver' : 'is-warn';
    return '<tr>' +
      '<td><div class="team-agent"><span class="team-avatar">' + esc(initial) + '</span><span>' + esc(name) + '</span></div></td>' +
      '<td class="adstat-num">' + esc(agent.total) + '</td>' +
      '<td class="team-blue">' + esc(agent.confirmed) + '</td>' +
      '<td><span class="team-pill ' + confClass + '">' + esc(agent.conf_rate) + '%</span></td>' +
      '<td class="team-green">' + esc(agent.delivered) + '</td>' +
      '<td><span class="team-pill ' + delClass + '">' + esc(agent.del_rate) + '%</span></td>' +
      '<td class="team-yellow">' + esc(agent.pending) + '</td>' +
      '<td class="team-red">' + esc(agent.cancelled) + '</td>' +
      '<td class="team-orange">' + esc(agent.returned) + '</td>' +
      '</tr>';
  }).join('');
}
</script>
