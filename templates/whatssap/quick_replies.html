<div class="quick-replies-page">
    <header class="quick-replies-header">
        <div class="quick-replies-title-wrap">
            <span class="quick-replies-icon"><i class="fas fa-bolt"></i></span>
            <div>
                <h2 class="quick-replies-title">Quick Replies</h2>
                <p class="quick-replies-subtitle">Type <kbd>/shortcut</kbd> in chat to insert a saved reply.</p>
            </div>
        </div>
        <div class="quick-replies-header-actions">
            <div class="qr-search">
                <i class="fas fa-search"></i>
                <input type="search" id="qr_search" placeholder="Search shortcut or message" autocomplete="off">
            </div>
            <button type="button" class="quick-replies-btn-new" data-bs-toggle="modal" data-bs-target="#addReplyModal">
                <i class="fas fa-plus"></i>
                <span>New Reply</span>
            </button>
        </div>
    </header>

    <div class="quick-replies-content">
        <section class="quick-replies-section" id="qr_mine_section">
            <div class="quick-replies-section-header">
                <span class="quick-replies-section-icon"><i class="fas fa-user"></i></span>
                <h3 class="quick-replies-section-title">My replies</h3>
                <span class="qr-count" id="qr_mine_count">0</span>
            </div>
            <div id="my_replies_grid" class="qr-grid"></div>
        </section>

        <section class="quick-replies-section" id="qr_team_section">
            <div class="quick-replies-section-header">
                <span class="quick-replies-section-icon team"><i class="fas fa-users"></i></span>
                <h3 class="quick-replies-section-title">Team replies</h3>
                <span class="qr-count" id="qr_team_count">0</span>
            </div>
            <div id="team_replies_grid" class="qr-grid"></div>
        </section>

        <div id="replies_loader" class="quick-replies-loader" style="display: none;">
            <div class="quick-replies-spinner"></div>
            <p class="quick-replies-loader-text">Loading replies…</p>
        </div>
    </div>
</div>

<div class="modal fade" id="addReplyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content quick-replies-modal-content">
            <div class="modal-header quick-replies-modal-header">
                <h5 class="modal-title">Create Quick Reply</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body quick-replies-modal-body">
                <form id="createReplyForm" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="quick-replies-form-group">
                        <label class="quick-replies-label">Shortcut</label>
                        <div class="quick-replies-input-prefix">
                            <span class="quick-replies-prefix">/</span>
                            <input type="text" name="shortcut" class="quick-replies-input" placeholder="e.g. welcome" required>
                        </div>
                        <span class="quick-replies-hint">Type this in chat to insert the reply</span>
                    </div>
                    <div class="quick-replies-form-group">
                        <label class="quick-replies-label">Message</label>
                        <textarea name="message" class="quick-replies-textarea" rows="4" placeholder="Enter the message text…"></textarea>
                    </div>
                    <div class="quick-replies-form-group">
                        <label class="quick-replies-label">Attachment <span class="quick-replies-optional">(optional)</span></label>
                        <input type="file" name="attachment" class="quick-replies-file-input" accept="video/mp4,image/png,image/jpeg,image/jpg,application/pdf">
                        <span class="quick-replies-hint">Video (mp4), image (png, jpg), or PDF</span>
                    </div>
                </form>
            </div>
            <div class="modal-footer quick-replies-modal-footer">
                <button type="button" class="quick-replies-btn quick-replies-btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="quick-replies-btn quick-replies-btn-primary" onclick="submitReplyForm()">
                    <i class="fas fa-check me-2"></i>Save Reply
                </button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="mediaPreviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content quick-replies-preview-modal">
            <div class="modal-header quick-replies-preview-header">
                <h6 class="modal-title" id="previewTitle">Preview</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body quick-replies-preview-body">
                <div id="mediaPreviewContainer" class="w-100 h-100"></div>
            </div>
        </div>
    </div>
</div>

<script>
    function submitReplyForm() {
    var form = document.getElementById('createReplyForm');
    var formData = new FormData(form);
    var isEdit = window.editingReplyId;
    if (isEdit) {
        formData.append('id', window.editingReplyId);
    } else {
        formData.append('channel', currentChannelId || window.currentChannelId || 0);
    }
    var url = isEdit ? "{% url 'api_update_canned_response' %}" : "{% url 'api_create_canned_response' %}";
    $.ajax({
        url: url,
        type: "POST",
        data: formData,
        processData: false,
        contentType: false,
        headers: {
            "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
        },
        success: function() {
            $('#addReplyModal').modal('hide');
            window.editingReplyId = undefined;
            var modal = document.getElementById('addReplyModal');
            if (modal) {
                var t = modal.querySelector('.modal-title');
                if (t) t.textContent = 'Create Quick Reply';
            }
            form.reset();
            if (typeof window.loadQuickRepliesGrid === 'function') {
                window.loadQuickRepliesGrid(currentChannelId || window.currentChannelId || 0);
            } else {
                location.reload();
            }
        },
        error: function(xhr) {
            alert("Error saving reply: " + (xhr.responseJSON && xhr.responseJSON.error ? xhr.responseJSON.error : xhr.responseText));
        }
    });
}

function deleteReply(id) {
    if (!confirm("Are you sure you want to delete this quick reply?")) return;
    var fd = new FormData();
    fd.append('id', id);
    fd.append('csrfmiddlewaretoken', document.querySelector('[name=csrfmiddlewaretoken]').value);
    $.ajax({
        url: "{% url 'api_delete_canned_response' %}",
        type: "POST",
        data: fd,
        processData: false,
        contentType: false,
        success: function() {
            if (typeof window.loadQuickRepliesGrid === 'function') {
                window.loadQuickRepliesGrid(currentChannelId || window.currentChannelId || 0);
            }
        },
        error: function(xhr) {
            alert("Failed to delete: " + (xhr.responseJSON && xhr.responseJSON.error ? xhr.responseJSON.error : xhr.responseText));
        }
    });
}

function editReply(id) {
    window.editingReplyId = undefined;
    var reply = window.quickRepliesData && window.quickRepliesData[id];
    if (!reply) {
        alert("Reply data not found. Try refreshing the list.");
        return;
    }
    window.editingReplyId = id;
    var modal = document.getElementById('addReplyModal');
    var titleEl = modal ? modal.querySelector('.modal-title') : null;
    if (titleEl) titleEl.textContent = "Edit Quick Reply";
    var form = document.getElementById('createReplyForm');
    if (form) {
        form.querySelector('[name="shortcut"]').value = reply.shortcut || '';
        form.querySelector('[name="message"]').value = reply.message || '';
        form.querySelector('[name="attachment"]').value = '';
    }
    $('#addReplyModal').modal('show');
}



function openMediaPreview(type, url, title) {
    const container = $('#mediaPreviewContainer');
    const titleEl = $('#previewTitle');
    
    // تنظيف المحتوى السابق
    container.empty();
    titleEl.text(`Preview: /${title}`);

    let htmlContent = '';

    if (type === 'video') {
        // 🔥 فيديو: تشغيل تلقائي مع أدوات التحكم
        htmlContent = `
            <video controls autoplay style="max-width: 100%; max-height: 80vh; outline: none;">
                <source src="${url}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        `;
    } 
    else if (type === 'audio') {
        // 🔥 صوت: مشغل صوتي كبير وواضح
        htmlContent = `
            <div class="p-5">
                <i class="fas fa-music fa-5x text-warning mb-4"></i>
                <br>
                <audio controls autoplay style="width: 300px;">
                    <source src="${url}" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
            </div>
        `;
    } 
    else if (type === 'image') {
        // 🔥 صورة: عرض الصورة كاملة
        htmlContent = `
            <img src="${url}" class="img-fluid" style="max-height: 80vh;" alt="Full Preview">
        `;
    } 
    else if (type === 'document') {
        htmlContent = `
            <div class="p-5 text-center">
                <i class="fas fa-file-pdf fa-5x text-white mb-3"></i>
                <h5 class="text-white">Document Preview</h5>
                <a href="${url}" target="_blank" class="btn btn-primary mt-3">
                    <i class="fas fa-external-link-alt"></i> Open Document
                </a>
            </div>
        `;
    }

    container.html(htmlContent);
    $('#mediaPreviewModal').modal('show');
}

// Reset add/edit modal when closed or when opened for "New"
$('#addReplyModal').on('show.bs.modal', function () {
    if (!window.editingReplyId) {
        $(this).find('.modal-title').text('Create Quick Reply');
        document.getElementById('createReplyForm').reset();
    }
});
$('#addReplyModal').on('hidden.bs.modal', function () {
    window.editingReplyId = undefined;
    $(this).find('.modal-title').text('Create Quick Reply');
    document.getElementById('createReplyForm').reset();
});

// Stop media when preview modal closes
$('#mediaPreviewModal').on('hidden.bs.modal', function () {
    $('#mediaPreviewContainer').empty();
});






$(document).ready(function() {
    $('#qr_search').on('input', function() {
        if (typeof window.filterQuickReplies === 'function') window.filterQuickReplies(this.value);
    });
    $(document).on('click', '.qr-preview', function(e) {
        e.preventDefault();
        e.stopPropagation();
        openMediaPreview(this.getAttribute('data-type'), this.getAttribute('data-url'), this.getAttribute('data-shortcut'));
    });

    // عند النقر على زر فتح إدارة الردود
    $('#btn_open_quick_replies').click(function() {
        // 1. إظهار القسم (متلا في مودال أو في وسط الصفحة حسب تصميمك)
        $('#quick_replies_section').show(); // أو $('#yourModal').modal('show');
        
        // 2. تحميل البيانات
        window.loadQuickRepliesGrid(currentChannelId || 0);
    });

    window.loadQuickRepliesGrid = function(channel) { 
    const myGrid = $('#my_replies_grid');
    const teamGrid = $('#team_replies_grid');
    const loader = $('#replies_loader');

    myGrid.empty();
    teamGrid.empty();
    loader.show();

    const currentChan = channel || currentOpenChatId || 0;
    

    $.ajax({
        url: `/discount/whatssapAPI/api/get-canned-responses?channel_id=${currentChan}`,
        method: 'GET',
        success: function(response) {
            loader.hide();
            window.quickRepliesData = {};
            (response.data || []).forEach(function(reply) {
                window.quickRepliesData[reply.id] = reply;
                const rowHTML = createReplyRowHTML(reply);
                if (reply.is_mine) {
                    myGrid.append(rowHTML);
                } else {
                    teamGrid.append(rowHTML);
                }
            });
            var mineCount = myGrid.children('.qr-card').length;
            var teamCount = teamGrid.children('.qr-card').length;
            $('#qr_mine_count').text(mineCount);
            $('#qr_team_count').text(teamCount);
            if (!mineCount) {
                myGrid.html('<div class="qr-empty"><div class="qr-empty-mark"><i class="fas fa-bolt"></i></div><p>No replies yet. Create one with New Reply.</p></div>');
            }
            if (!teamCount) {
                teamGrid.html('<div class="qr-empty"><div class="qr-empty-mark"><i class="fas fa-users"></i></div><p>No team replies on this channel.</p></div>');
            }
            if (typeof window.filterQuickReplies === 'function') {
                window.filterQuickReplies($('#qr_search').val());
            }
        },
        error: function() {
            loader.hide();
            // toastr.error("Failed to load replies"); // يفضل استخدام تنبيه لطيف
        }
    });
}



    function qrEscape(value) {
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    window.filterQuickReplies = function(query) {
        var q = String(query || '').trim().toLowerCase();
        document.querySelectorAll('.qr-card').forEach(function(card) {
            var hay = (card.getAttribute('data-search') || '').toLowerCase();
            card.style.display = !q || hay.indexOf(q) !== -1 ? '' : 'none';
        });
    };

    function createReplyRowHTML(reply) {
        var media = reply.media_type || 'text';
        var icons = { image: 'fa-image', video: 'fa-video', audio: 'fa-microphone', document: 'fa-file' };
        var labels = { image: 'Image', video: 'Video', audio: 'Audio', document: 'File', text: 'Text' };
        var icon = icons[media] || 'fa-align-left';
        var label = labels[media] || 'Text';
        var message = reply.message || (media !== 'text' ? (label + ' only') : 'No message');
        var shortcut = reply.shortcut || 'no-code';
        var author = reply.author || 'Unknown';
        var created = reply.created_at || '';
        var uses = Number(reply.usage_count || 0);
        var search = qrEscape((shortcut + ' ' + (reply.message || '') + ' ' + author).toLowerCase());
        var preview = '';
        if (reply.file_url) {
            preview = '<button type="button" class="qr-preview" data-type="' + qrEscape(media) + '" data-url="' + qrEscape(reply.file_url) + '" data-shortcut="' + qrEscape(shortcut) + '"><i class="fas fa-eye"></i> Preview</button>';
        }
        return ''
            + '<article class="qr-card" data-search="' + search + '">'
            + '<div class="qr-card-top">'
            + '<span class="shortcut-badge">/' + qrEscape(shortcut) + '</span>'
            + '<span class="qr-kind qr-kind--' + qrEscape(media) + '"><i class="fas ' + icon + '"></i>' + qrEscape(label) + '</span>'
            + '<div class="qr-card-actions">'
            + '<button type="button" class="qr-icon-btn" onclick="editReply(' + Number(reply.id) + ')" aria-label="Edit"><i class="fas fa-pen"></i></button>'
            + '<button type="button" class="qr-icon-btn qr-icon-btn--danger" onclick="deleteReply(' + Number(reply.id) + ')" aria-label="Delete"><i class="fas fa-trash"></i></button>'
            + '</div></div>'
            + '<p class="qr-message">' + qrEscape(message) + '</p>'
            + '<div class="qr-card-foot">'
            + '<span class="usage-count">' + uses + (uses === 1 ? ' use' : ' uses') + '</span>'
            + '<span class="qr-meta">' + qrEscape(author) + '</span>'
            + '<span class="qr-meta">' + qrEscape(created) + '</span>'
            + preview
            + '</div></article>';
    }
    
})
</script>


<style>
.quick-replies-page {
    min-height: 100%;
    padding: 0 0 28px;
    background: transparent;
}
.quick-replies-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin: 1rem 1.25rem 0;
    padding: 1rem 1.1rem;
    border-radius: 16px;
    border: 1px solid rgba(148,163,184,0.14);
    background: rgba(18,22,31,0.92);
    box-shadow: 0 16px 40px rgba(0,0,0,0.22);
}
.quick-replies-title-wrap { display: flex; align-items: center; gap: 14px; min-width: 0; }

}
.quick-replies-title { margin: 0 0 4px; font-size: 1.15rem; font-weight: 700; letter-spacing: -0.02em; color: #f8fafc !important; }
.quick-replies-subtitle { margin: 0; font-size: 0.84rem; color: #94a3b8 !important; line-height: 1.45; }
.quick-replies-subtitle kbd {
    padding: 1px 6px; font-size: 0.75rem; font-family: ui-monospace, monospace;

    border-radius: 6px; color: #c4b5fd;
}
.quick-replies-header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    color: #94a3b8;

.quick-replies-modal-header {
    padding: 1.15rem 1.35rem;

    font-size: 1.1rem;
